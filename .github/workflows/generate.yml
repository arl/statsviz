on: [push, pull_request]
name: Generate
jobs:
  check-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          # Plots info texts come from the runtime/metrics descriptions of the
          # Go version running the generator: it must be the latest Go version
          # supported by statsviz (the last one in tests-linux.yml).
          go-version: '1.27.x'
      - name: Vet generator
        run: go vet ./...
        working-directory: internal/plot/internal/gen
      - name: Generator go mod tidy check
        run: go mod tidy -diff
        working-directory: internal/plot/internal/gen
      - name: Check generated plots are up to date
        run: |
          go generate ./internal/plot
          git diff --exit-code || {
            echo "::error::internal/plot/plots_gen.go is out of date, run 'go generate ./internal/plot' and commit the result."
            exit 1
          }
